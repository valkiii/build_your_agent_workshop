name: Smoke test (setup scripts)

# Exercises the click-to-run scripts on real Windows and macOS runners:
# creates the venv, installs requirements.txt from clean, imports every module,
# and boots the Streamlit app. Skips the Ollama install and the multi-GB model
# download (CURATOR_SKIP_MODEL) — those need a from-scratch machine to test.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    env:
      CURATOR_SKIP_MODEL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run setup.bat (skip model, no launch)
        shell: cmd
        run: setup.bat
      - name: venv was created
        shell: cmd
        run: if not exist ".venv\Scripts\streamlit.exe" exit /b 1
      - name: Every module imports
        shell: cmd
        run: |
          set PYTHONPATH=src
          .venv\Scripts\python.exe -c "import config, discovery_agent, article_scraper, summarizer, curator, quiz_agent, evaluation_agent, publisher_agent, main; print('imports OK; model =', config.MODEL_NAME)"
      - name: Streamlit app boots
        shell: pwsh
        run: |
          Start-Process .venv\Scripts\streamlit.exe -ArgumentList 'run','src/app.py','--server.headless','true','--server.port','8501'
          foreach ($i in 1..30) {
            try { if ((Invoke-WebRequest 'http://localhost:8501/_stcore/health' -UseBasicParsing).Content.Trim() -eq 'ok') { 'health ok'; exit 0 } } catch {}
            Start-Sleep 2
          }
          'health check failed'; exit 1

  macos:
    runs-on: macos-latest
    env:
      CURATOR_SKIP_MODEL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run setup.command (skip model, no launch)
        run: ./setup.command
      - name: venv was created
        run: test -x .venv/bin/streamlit
      - name: Every module imports
        run: |
          PYTHONPATH=src ./.venv/bin/python -c "import config, discovery_agent, article_scraper, summarizer, curator, quiz_agent, evaluation_agent, publisher_agent, main; print('imports OK; model =', config.MODEL_NAME)"
      - name: Streamlit app boots
        run: |
          ./.venv/bin/streamlit run src/app.py --server.headless true --server.port 8501 &
          for i in $(seq 1 30); do
            [ "$(curl -s http://localhost:8501/_stcore/health)" = "ok" ] && echo "health ok" && exit 0
            sleep 2
          done
          echo "health check failed"; exit 1
